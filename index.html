<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Саша 😂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111, #2b2b2b);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 600px;
      padding: 40px 25px;
      border-radius: 25px;
      background: #ffffff12;
      border: 1px solid #ffffff25;
      box-shadow: 0 20px 60px #0008;
    }

    h1 {
      font-size: clamp(32px, 8vw, 60px);
      margin: 0 0 25px;
    }

    p {
      font-size: 22px;
      line-height: 1.4;
      margin: 0;
    }

    .emoji {
      font-size: 70px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>САША 😂</h1>

    <p>
      ТЫ ОПЯТЬ ШОЛИ ПЕРЕХОДИШЬ<br>
      ПО СКАМ ССЫЛКАМ? 😂
    </p>

    <div class="emoji">💀🤦‍♂️😂</div>
  </div>

</body>
</html>
